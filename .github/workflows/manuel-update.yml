name: Daily MLB Projection Model

on:
  workflow_dispatch: # This is now the ONLY trigger

jobs:
  run-model:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Run MLB Projection Script (Scraper)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scraper.py

      - name: Run Flat $25 Backtest
        run: python backtest.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json projections_history.csv backtest_results.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated manual trigger update" && git push)
