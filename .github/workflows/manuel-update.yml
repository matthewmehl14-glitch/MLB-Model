name: Daily MLB Projection Model

on:
  schedule:
    # Runs at 14:00 UTC (9:00 AM CDT) every day to capture stable market lines
    - cron: '0 14 * * *'
  workflow_dispatch: # Adds a button in GitHub UI so you can trigger it manually anytime

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Run MLB Projection Script
        env:
          # Your key is hidden. Add it in GitHub > Settings > Secrets > Actions
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python mlb_model.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json projections_history.csv
          
          # Only commit if data changed to prevent workflow errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily MLB projections update" && git push)
