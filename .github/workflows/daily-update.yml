name: Daily MLB Data Update

on:
  schedule:
    # Runs at 16:00 UTC, which is 11:00 AM Central Daylight Time (CDT)
    - cron: '0 16 * * *'
  workflow_dispatch: # Adds a button so you can manually run it anytime

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests numpy

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.json
        # Only commit if data.json actually changed
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily MLB stats update"
        git push
